[pytest]
# M3: deterministic collection.
#
# The repository root contains directories that are NOT test packages:
#   .venv/            - project virtualenv (1,894 files) - pytest would walk it
#   backups/          - .bak snapshots; pytest tried to import them as test modules
#   jarvis/, gemini/  - unrelated agent tooling, not part of the Lead Desk
#   path/, "pytest tests"/ - stray empty dirs from earlier commands
#
# Restrict collection to the real test directory and keep the runtime
# stdlib + pytest (RULES_SHORT.md #5).
testpaths = tests
norecursedirs = .venv .git .pytest_cache backups backupss12fix __pycache__ jarvis gemini path "pytest tests" logs docs evaluation tools data app market *.bak* *.txt
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q

# M3: put the project root on sys.path so `from app.policy import ...` and
# `from market.fh_query import ...` resolve in EVERY invocation style.
#
# Why this is required (verified 2026-10-21):
#   `python -m pytest` prepends the CWD to sys.path -> imports work.
#   `pytest` (the console script) does NOT -> with `pytest tests/test_x.py`
#       pytest inserts the *test file's* directory (tests/) rather than the
#       project root, so `import app` fails with ModuleNotFoundError.
#   The project has no tests/__init__.py and no installed package, so nothing
#       else puts the root on sys.path.
#
# `pythonpath` is a built-in pytest ini option (pytest >= 7.0) and is the
# supported, portable way to do this. Verified: it makes the file-argument
# invocation collect and run correctly under both `pytest` and `python -m pytest`.
pythonpath = .
